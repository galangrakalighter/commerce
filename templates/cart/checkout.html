{% extends 'base.html' %}

{% block content %}
<div class="bg-[#FAF8F5] min-h-screen py-12">
    <div class="container mx-auto px-4 max-w-2xl">
        <div class="bg-white p-8 rounded-3xl border border-stone-100 shadow-sm">
            <h2 class="text-2xl font-serif text-stone-900 mb-6">Informasi Pengiriman</h2>
            
            {% if error_api %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs font-medium mb-4">
                ❌ {{ error_api }}
            </div>
            {% endif %}
            
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1">Nama Penerima</label>
                    <input type="text" name="nama_penerima" required class="w-full bg-[#FAF8F5] border border-[#EAE3D2] rounded-xl py-2 px-4 text-sm outline-none focus:border-[#8C7454]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1">Nomor Telepon/WhatsApp</label>
                    <input type="text" name="telepon" required class="w-full bg-[#FAF8F5] border border-[#EAE3D2] rounded-xl py-2 px-4 text-sm outline-none focus:border-[#8C7454]">
                </div>
                
                <div class="relative">
                    <label class="block text-xs font-medium text-stone-700 mb-1">Alamat Lengkap</label>
                    <textarea id="input-alamat" name="alamat_lengkap" rows="4" required placeholder="Ketik nama jalan, komplek, atau kota tempat tinggalmu..." class="w-full bg-[#FAF8F5] border border-[#EAE3D2] rounded-xl py-2 px-4 text-sm outline-none focus:border-[#8C7454] resize-none"></textarea>
                    
                    <div id="dropdown-alamat" class="absolute left-0 right-0 mt-1 bg-white border border-stone-200 rounded-xl shadow-lg max-h-60 overflow-y-auto hidden z-50">
                        </div>
                    <span id="loading-alamat" class="absolute right-3 top-9 text-xs text-stone-400 hidden animate-pulse">Mencari...</span>
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1">Catatan Tambahan (Opsional)</label>
                    <input type="text" name="catatan" class="w-full bg-[#FAF8F5] border border-[#EAE3D2] rounded-xl py-2 px-4 text-sm outline-none focus:border-[#8C7454]">
                </div>
                
                <div class="border-t border-stone-100 pt-4 mt-6 flex justify-between items-center">
                    <div>
                        <span class="text-xs text-stone-400 block">Total yang harus dibayar:</span>
                        <span class="text-xl font-bold text-[#8C7454]">Rp {{ total_belanja }}</span>
                    </div>
                    <button type="submit" class="bg-[#8C7454] text-white px-8 py-3 rounded-full text-sm font-medium hover:bg-[#735F43] transition-colors shadow-md cursor-pointer">
                        Proses Pembayaran
                    </button>
                </div>
            </form>
            
            <a href="{% url 'home' %}" class="block text-center text-xs text-stone-400 mt-4 hover:underline">
                Kembali Belanja
            </a>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputAlamat = document.getElementById("input-alamat");
        const dropdownAlamat = document.getElementById("dropdown-alamat");
        const loadingAlamat = document.getElementById("loading-alamat");
        let timeoutDebounce = null;

        inputAlamat.addEventListener("input", function() {
            const query = inputAlamat.value.trim();

            // Bersihkan timeout lama (Debouncing)
            clearTimeout(timeoutDebounce);

            // Jika inputan masih terlalu pendek, sembunyikan dropdown
            if (query.length < 4) {
                dropdownAlamat.classList.add("hidden");
                return;
            }

            // Tunggu user selesai mengetik sejenak (300 milidetik)
            timeoutDebounce = setTimeout(() => {
                loadingAlamat.classList.remove("hidden");

                const urlApi = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=id&limit=5&addressdetails=1`;

                fetch(urlApi, {
                    headers: { 'Accept-Language': 'id' }
                })
                .then(response => response.json())
                .then(results => {
                    dropdownAlamat.innerHTML = "";
                    loadingAlamat.classList.add("hidden");

                    if (results && results.length > 0) {
                        dropdownAlamat.classList.remove("hidden");

                        results.forEach(item => {
                            const opsi = document.createElement("div");
                            opsi.className = "px-4 py-3 text-sm text-stone-700 hover:bg-[#FAF8F5] cursor-pointer border-b border-stone-50 last:border-b-0 transition-colors flex items-start gap-2.5";
                            
                            const addr = item.address;
                            
                            // 1. KUNCI UTAMA: Baris atas harus berupa nama jalan atau nama tempat spesifik
                            // Jika tidak ada data jalan (road), gunakan potongan pertama dari display_name asli
                            let namaJalanUtama = addr.road || addr.pedestrian || addr.footway || addr.amenity || addr.shop || item.display_name.split(',')[0];
                            
                            // 2. KUNCI KEDUA: Menyusun wilayah dari tingkat terkecil ke terbesar
                            let infoWilayah = [];
                            
                            // Kelurahan / Desa / Kampung
                            if (addr.village || addr.suburb || addr.neighbourhood) {
                                let kelurahan = addr.village || addr.suburb || addr.neighbourhood;
                                // Pastikan nama kelurahan tidak kembar dengan nama jalan utama di atas
                                if (kelurahan.toLowerCase() !== namaJalanUtama.toLowerCase()) {
                                    infoWilayah.push(kelurahan);
                                }
                            }
                            
                            // Kecamatan
                            if (addr.city_district || addr.subdistrict) {
                                infoWilayah.push(addr.city_district || addr.subdistrict);
                            }
                            
                            // Kota / Kabupaten
                            if (addr.city || addr.regency || addr.municipality) {
                                infoWilayah.push(addr.city || addr.regency || addr.municipality);
                            }

                            // Gabungkan array menjadi teks penjelas ("Kelurahan, Kecamatan, Kota")
                            const teksWilayahPendek = infoWilayah.join(', ');

                            // Suntikkan struktur ke dalam elemen dropdown
                            opsi.innerHTML = `
                                <span class="text-base mt-0.5 flex-shrink-0">📍</span>
                                <div class="w-full">
                                    <p class="font-medium text-stone-900">${namaJalanUtama}</p>
                                    <p class="text-xs text-stone-400 mt-0.5">${teksWilayahPendek}</p>
                                </div>
                            `;

                            // Ketika alamat diklik
                            opsi.addEventListener("click", function() {
                                inputAlamat.value = item.display_name;
                                dropdownAlamat.classList.add("hidden");
                            });

                            dropdownAlamat.appendChild(opsi);
                        });
                    } else {
                        dropdownAlamat.classList.add("hidden");
                    }
                })
                .catch(error => {
                    console.error("Gagal memuat autocomplete alamat:", error);
                    loadingAlamat.classList.add("hidden");
                });
            }, 300);
        });

        // Sembunyikan dropdown jika klik di luar area input
        document.addEventListener("click", function(e) {
            if (!inputAlamat.contains(e.target) && !dropdownAlamat.contains(e.target)) {
                dropdownAlamat.classList.add("hidden");
            }
        });
    });
</script>
{% endblock %}
