{% extends 'base.html' %}

{% block content %}
<div class="bg-[#FAF8F5] min-h-screen py-12">
    <div class="container mx-auto px-4 max-w-2xl">
        <div class="bg-white p-8 rounded-3xl border border-stone-100 shadow-sm">
            <h2 class="text-2xl font-serif text-stone-900 mb-6">Informasi Pengiriman</h2>
            
            {% if error_api %}
            <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-xs font-medium mb-4">
                ❌ {{ error_api }}
            </div>
            {% endif %}
            
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1">Nama Penerima</label>
                    <input type="text" name="nama_penerima" required class="w-full bg-[#FAF8F5] border border-[#EAE3D2] rounded-xl py-2 px-4 text-sm outline-none focus:border-[#8C7454]">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1">Nomor Telepon/WhatsApp</label>
                    <input type="text" name="telepon" required class="w-full bg-[#FAF8F5] border border-[#EAE3D2] rounded-xl py-2 px-4 text-sm outline-none focus:border-[#8C7454]">
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1">Alamat Lengkap</label>
                    <textarea id="input-alamat" name="alamat_lengkap" rows="3" required class="w-full bg-[#FAF8F5] border border-[#EAE3D2] rounded-xl py-2 px-4 text-sm outline-none focus:border-[#8C7454] resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-2">Tandai Lokasi di Peta (Geser pin ke rumahmu):</label>
                    <div id="map" class="w-full h-64 rounded-xl border border-stone-200 z-10"></div>
                    <input type="hidden" name="lat" id="lat" value="-6.9175" required>
                    <input type="hidden" name="lon" id="lon" value="107.6191" required>
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1">Kode Pos</label>
                    <input type="text" name="kode_pos" class="w-full bg-[#FAF8F5] border border-[#EAE3D2] rounded-xl py-2 px-4 text-sm outline-none focus:border-[#8C7454]" required>
                </div>

                <div class="border-t border-stone-100 pt-4 mt-6 flex justify-between items-center">
                    <div>
                        <span class="text-xs text-stone-400 block">Total yang harus dibayar:</span>
                        <span class="text-xl font-bold text-[#8C7454]">Rp {{ total_belanja }}</span>
                    </div>
                    <button type="submit" class="bg-[#8C7454] text-white px-8 py-3 rounded-full text-sm font-medium hover:bg-[#735F43] transition-colors shadow-md">
                        Proses Pembayaran
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Inisialisasi Peta (Default Bandung)
        const map = L.map('map').setView([-6.9175, 107.6191], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Marker yang bisa digeser
        const marker = L.marker([-6.9175, 107.6191], { draggable: true }).addTo(map);

        // Update hidden input saat marker digeser
        marker.on('dragend', function(e) {
            const pos = marker.getLatLng();
            document.getElementById('lat').value = pos.lat;
            document.getElementById('lon').value = pos.lng;
        });

        // Opsional: Klik peta untuk memindahkan marker
        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            document.getElementById('lat').value = e.latlng.lat;
            document.getElementById('lon').value = e.latlng.lng;
        });
    });
</script>
{% endblock %}
