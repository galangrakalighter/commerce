{% extends 'base.html' %}

{% block content %}
<div class="bg-[#FAF8F5] min-h-screen py-20 flex items-center justify-center">
    <div class="bg-white p-10 rounded-3xl border border-stone-100 shadow-xl max-w-md w-full text-center">
        <div class="w-16 h-16 bg-amber-50 rounded-full flex items-center justify-center text-2xl text-[#8C7454] mx-auto mb-4">
            💳
        </div>
        <h2 class="text-2xl font-serif text-stone-900 mb-2">Satu Langkah Lagi</h2>
        <p class="text-sm text-stone-500 mb-6">Pesanan <span class="font-bold">#INV-{{ pesanan.id }}</span> telah dicatat. Silakan selesaikan pembayaran Anda.</p>
        
        <!-- Tombol langsung mengarah ke halaman Checkout DOKU -->
        <a href="{{ doku_payment_url }}" class="block w-full bg-[#8C7454] text-white py-4 rounded-full font-medium hover:bg-[#735F43] transition-colors shadow-lg cursor-pointer no-underline text-center">
            Bayar dengan DOKU
        </a>
    </div>
</div>
{% endblock %}
