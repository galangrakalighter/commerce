{% load static %}

<style>
    @keyframes loadingMove {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .nav-loading-bar{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:4px;
        background:rgba(197,160,89,.1);
        z-index:9999;
        overflow:hidden;
        display:none;
    }

    .nav-loading-inner{
        height:100%;
        width:60%;
        background:#C5A059;
        animation:loadingMove 1.2s infinite ease-in-out;
    }
</style>

<div class="nav-loading-bar">
    <div class="nav-loading-inner"></div>
</div>

<nav id="navbar"
     class="fixed w-full z-50 transition-all duration-500 bg-transparent py-6">

    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">

        <a href="{% url 'home_lfd' %}">
            <img id="logo"
                 src="{% static 'img/logo.png' %}"
                 class="h-10 md:h-14 transition-all duration-500 bg-transparent"
                 alt="Logo">
        </a>

        <!-- Desktop Menu -->
        <div class="hidden md:flex space-x-10 items-center">

            <a href="{% url 'home_lfd' %}"
               class="text-xs tracking-[0.2em] uppercase font-bold
               {% if request.path == '/' %}
               text-[#C5A059]
               {% else %}
               text-gray-700 hover:text-[#C5A059]
               {% endif %}">
                Beranda
            </a>

            <a href="{% url 'produk' %}"
               class="text-xs tracking-[0.2em] uppercase font-bold
               {% if request.path == '/produk' %}
               text-[#C5A059]
               {% else %}
               text-gray-700 hover:text-[#C5A059]
               {% endif %}">
                Produk
            </a>

            <a href="{% url 'artikel' %}"
               class="text-xs tracking-[0.2em] uppercase font-bold
               {% if request.path == '/artikel' %}
               text-[#C5A059]
               {% else %}
               text-gray-700 hover:text-[#C5A059]
               {% endif %}">
                Artikel
            </a>
            <a href="{% url 'home' %}"
               class="text-xs tracking-[0.2em] uppercase font-bold
               {% if request.path == '/commerce' %}
               text-[#C5A059]
               {% else %}
               text-gray-700 hover:text-[#C5A059]
               {% endif %}">
                Market
            </a>

        </div>

        <!-- Hamburger -->
        <button id="openMenu"
                class="md:hidden p-2 text-gray-800">
            ☰
        </button>

    </div>
</nav>

<!-- Backdrop -->
<div id="backdrop"
     class="fixed inset-0 bg-black/40 z-[60] hidden md:hidden">
</div>

<!-- Sidebar -->
<div id="sidebar"
     class="fixed top-0 right-0 h-full w-[280px] bg-white z-[70]
            translate-x-full transition-transform duration-500 md:hidden">

    <div class="flex flex-col h-full p-8">

        <div class="flex justify-between mb-12">
            <span class="text-[10px] uppercase text-gray-400">
                Menu
            </span>

            <button id="closeMenu">✕</button>
        </div>

        <div class="flex flex-col space-y-6">
            <a href="{% url 'home' %}">Beranda</a>
            <a href="#">Produk</a>
            <a href="#">Artikel</a>
        </div>

        <div class="mt-auto border-t pt-8">
            <p class="text-[10px] text-gray-400 italic">
                Laflyderm Beauty
            </p>
        </div>

    </div>
</div>
