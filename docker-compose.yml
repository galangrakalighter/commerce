services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY harus diisi di file .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SERVE_MEDIA: ${DJANGO_SERVE_MEDIA:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://laflyderm.lightermediagroup.com}
      BITESHIP_API_KEY: ${BITESHIP_API_KEY:?BITESHIP_API_KEY harus diisi di file .env}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      DOKU_CLIENT_ID: ${DOKU_CLIENT_ID:?DOKU_CLIENT_ID harus diisi di file .env}
      DOKU_SECRET_KEY: ${DOKU_SECRET_KEY:?DOKU_SECRET_KEY harus diisi di file .env}
      POSTGRES_DB: ${POSTGRES_DB:-commerce_lfd}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD harus diisi di file .env}
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST harus diisi dengan nama container PostgreSQL}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn commerce.wsgi:application --bind 0.0.0.0:2026 --workers 3 --timeout 60
             --access-logfile - --error-logfile -"
    ports:
      - "2026:2026"
    volumes:
      - ./media:/app/media
      - static_data:/app/staticfiles
    networks:
      - database_network

volumes:
  static_data:

networks:
  database_network:
    external: true
    name: ${DOCKER_NETWORK:?DOCKER_NETWORK harus diisi dengan network PostgreSQL}
